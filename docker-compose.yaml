services:
  front:
    build:
      context: ${LOCAL_WORKSPACE_FOLDER:-.}/front
      dockerfile: Dockerfile.dev
    working_dir: /workspace/front
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/front:/workspace/front
      - front_node_modules:/workspace/front/node_modules
      - front_playwright_browsers:/root/.cache/ms-playwright
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # Full-stack compose talks to back for the write E2E. For front-only dev
      # (npm run dev) the .env.example default keeps mock mode on.
      NEXT_PUBLIC_MOCK_MODE: "false"
    depends_on:
      - back

  back:
    build:
      context: ${LOCAL_WORKSPACE_FOLDER:-.}/back
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      GCP_PROJECT: local-project
      BIGQUERY_EMULATOR_HOST: http://bigquery-emulator:9050
      AGENT_BASE_URL: http://agent:8080
      # Route extraction to the agent service (real Gemini when a key is set).
      USE_AGENT_EXTRACTION: "true"
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/back:/app
    depends_on:
      - bigquery-emulator
      - agent

  agent:
    build:
      context: ${LOCAL_WORKSPACE_FOLDER:-.}/agent
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      GCP_PROJECT: local-project
      # Real Gemini when GEMINI_API_KEY is provided (host env or root .env);
      # empty key falls back to the agent's deterministic mock extractor.
      MOCK_MODE: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash
      # GEMINI_API_KEY is a Vertex AI key -> use the Vertex backend.
      USE_VERTEXAI: "true"
      GCP_LOCATION: ${GCP_LOCATION:-global}
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/agent:/app

  bigquery-emulator:
    image: ghcr.io/goccy/bigquery-emulator:latest
    command:
      - --project=local-project
      - --dataset=qualityops
    ports:
      - "9050:9050"

volumes:
  front_node_modules:
  front_playwright_browsers:
