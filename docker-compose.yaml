services:
  front:
    image: node:24-bookworm
    working_dir: /workspace/front
    volumes:
      - ./front:/workspace/front
      - front_node_modules:/workspace/front/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - back

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: ./back/.env
    volumes:
      - ./back:/app
    depends_on:
      - bigquery-emulator
      - ollama

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: ./agent/.env
    volumes:
      - ./agent:/app
    depends_on:
      - bigquery-emulator
      - ollama

  bigquery-emulator:
    image: ghcr.io/goccy/bigquery-emulator:latest
    command:
      - --project=local-project
      - --dataset=cda
    ports:
      - "9050:9050"

  ollama:
    image: ollama/ollama:0.30.10
    container_name: ollama-ai
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    restart: always
    gpus: all
    # GPU support (uncomment if available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  front_node_modules:
