services:
  front:
    image: node:24-bookworm
    working_dir: /workspace/front
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/front:/workspace/front
      - front_node_modules:/workspace/front/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - back

  back:
    build:
      context: ${LOCAL_WORKSPACE_FOLDER:-.}/back
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      GCP_PROJECT: local-project
      BIGQUERY_EMULATOR_HOST: http://bigquery-emulator:9050
      AGENT_BASE_URL: http://agent:8080
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/back:/app
    depends_on:
      - bigquery-emulator

  agent:
    build:
      context: ${LOCAL_WORKSPACE_FOLDER:-.}/agent
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      GCP_PROJECT: local-project
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/agent:/app

  bigquery-emulator:
    image: ghcr.io/goccy/bigquery-emulator:latest
    command:
      - --project=local-project
      - --dataset=qualityops
    ports:
      - "9050:9050"
  
  ollama:
    image: ollama/ollama:0.30.10
    container_name: ollama-ai
    ports:
      - 11434:11434
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/ollama:/root/.ollama
    restart: always
    gpus: all

volumes:
  front_node_modules:
