[project]
name = "continuous-discovery-agent"
version = "0.1.0"
description = "Multi-agent system for SME tacit knowledge discovery with BigQuery Graph and Cloud Storage Wiki"
requires-python = ">=3.10"
dependencies = [
  "google-adk>=1.0.0",
  "google-cloud-bigquery>=3.25.0",
  "google-cloud-storage>=2.18.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
]

[tool.setuptools.packages.find]
include = ["cda_agents*"]
