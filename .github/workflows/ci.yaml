name: ci

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  ai-review:
    uses: aba4b3a/ai-agent-hackason_ai-common/.github/workflows/ai-review.yml@5620f881413f5a961e6f956ff8f73db255e46cdb

  security-check:
    uses: aba4b3a/ai-agent-hackason_ai-common/.github/workflows/security-check.yml@5620f881413f5a961e6f956ff8f73db255e46cdb

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  back:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest
