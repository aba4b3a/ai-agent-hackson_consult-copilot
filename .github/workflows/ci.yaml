name: ci

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

# ai-review / security-check jobs (reusable workflows from
# aba4b3a/ai-agent-hackason_ai-common) are temporarily removed: GitHub
# rejects the whole workflow file with "workflow was not found" when it
# can't resolve them (private repo, no cross-repo Actions access from a
# personal-account repo), which was blocking front/back/agent too since
# GitHub validates every reusable-workflow reference in a file before
# running any job in it. Re-add once that repo's access is sorted out.
jobs:
  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  back:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest
