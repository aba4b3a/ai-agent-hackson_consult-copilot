[project]
name = "continuous-discovery-agent-fastapi"
version = "0.2.0"
description = "FastAPI backend for SME tacit knowledge discovery with ADK, BigQuery Graph, and Cloud Storage Wiki"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "google-cloud-bigquery>=3.25.0",
  "google-cloud-storage>=2.18.0",
  "google-adk>=1.0.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "ollama>=0.2.0"
]

[dependency-groups]
dev = ["pytest>=8.3.0", "httpx>=0.27.0", "ruff>=0.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
