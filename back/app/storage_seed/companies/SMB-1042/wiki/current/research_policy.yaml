      purpose: "価格再確認と競合比較の発生状況を把握する。"
      related_kpis:
        - "kpi_quote_win_rate"
        - "kpi_quote_gross_margin"
      related_focus_metrics:
        - "focus_price_recheck_count"
      base_questions:
