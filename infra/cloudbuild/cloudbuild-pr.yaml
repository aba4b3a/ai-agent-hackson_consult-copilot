steps:
  - name: node:24
    dir: front
    entrypoint: npm
    args: ["ci"]

  - name: node:24
    dir: front
    entrypoint: npm
    args: ["run", "lint"]

  - name: node:24
    dir: front
    entrypoint: npm
    args: ["run", "typecheck"]

  - name: python:3.12
    dir: back
    entrypoint: bash
    args:
      - -c
      - |
        pip install uv
        uv sync
        uv run ruff check .
        uv run mypy app
        uv run pytest

  - name: python:3.12
    dir: agent
    entrypoint: bash
    args:
      - -c
      - |
        pip install uv
        uv sync
        uv run ruff check .
        uv run mypy .
        uv run pytest
