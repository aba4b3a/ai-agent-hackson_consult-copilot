worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;

  # Log to stdout so Cloud Run picks it up as request logs.
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout main;

  # Cloud Run passes $PORT (default 8080) to the ingress container.
  server {
    listen 8080 default_server;
    server_name _;

    # Front static assets built by Next.js `output: "export"`.
    root /usr/share/nginx/html;
    index index.html;

    # FastAPI back — routes under /api/*.
    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 180s;
    }

    # ADK agent — strip the /agent prefix before forwarding.
    location /agent/ {
      proxy_pass http://127.0.0.1:8081/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 300s;
    }

    # Lightweight health endpoint for probes / debugging.
    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # Static SPA fallback: try file, .html, dir/index.html, then / (SPA).
    location / {
      try_files $uri $uri.html $uri/index.html /index.html;
    }
  }
}
