[project]
name = "consult-copilot-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "httpx>=0.28.0",
  "google-cloud-storage>=2.19.0",
  "google-cloud-bigquery>=3.25.0",
  "google-adk>=1.0.0",
  "ollama>=0.2.0",
  "python-dotenv>=1.0.1"
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# tools/* uses bare `dict`/`list` for loosely-typed JSON-like tool payloads
# throughout (same convention as back's non-strict mypy config); enforcing
# explicit generic args here would require annotating every one of them.
disallow_any_generics = false
# build/ は setuptools の生成物（Duplicate module エラー防止のため除外）
exclude = ["build"]

# google-cloud-storage の import に付けた type: ignore は、環境（スタブ解決の有無）
# によって必要/不要の判定が変わるため、このモジュールのみ unused-ignore 警告を無効化。
[[tool.mypy.overrides]]
module = "tools.storage_tools"
warn_unused_ignores = false

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = [
  "setuptools>=65.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
  "agents",
  "eval",
  "prompts",
  "tools",
]
